  ar:{ episodes:'الحلقات', share:'مشاركة', start:'ابدأ القراءة', episode:'الحلقة',
       wbig:'تريد القصة كاملة؟', wcta:'شاهد الحلقة كاملة على يوتيوب', soon:'قريبًا', chan:'مختبرات عداني على يوتيوب',
       sources:'المصادر', srcNote:'كل سطر في هذه الصفحة رُوجع على هذه المصادر.',
       foot:'مختبرات عداني. العلم كما ورد في الأبحاث.', source:'المصدر', newTab:'يفتح في نافذة جديدة',
       copied:'تم نسخ الرابط', of:'من', progress:'التقدّم في القصة', noData:'تعذّر تحميل قصة هذه الحلقة.' }
};
var reduce = W.matchMedia('(prefers-reduced-motion: reduce)').matches;
var lang = (function(){ var v = null; try{ v = localStorage.getItem('al-lang'); }catch(e){}
  if (v === 'en' || v === 'ar') return v; return String(navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en'; })();
var storyEl = doc.getElementById('story'), prog = doc.getElementById('prog');
if (!S || !S.scenes || !S.scenes.length){ storyEl.innerHTML = '<div class="nodata">' + UI[lang].noData + '</div>'; return; }

function t(o){ if (o == null) return ''; if (typeof o !== 'object') return String(o); return o[lang] != null ? o[lang] : (o.en || ''); }
function u(k){ return UI[lang][k]; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var N = S.scenes.length, NSCR = N + 2; /* hero + screens + watch */

/* sources fold (English, as published) and the art */
doc.getElementById('srcList').innerHTML = (S.sources || []).map(function(s){ return '<li>' + s + '</li>'; }).join('');
['heroArt','watchArt'].forEach(function(id){ var im = doc.getElementById(id); im.src = S.art.src; if (S.art.small) im.srcset = S.art.small + ' 960w, ' + S.art.src + ' ' + S.art.w + 'w'; im.sizes = '(min-width:900px) 60vw, 100vw'; });
doc.getElementById('watchTop').setAttribute('data-n', NSCR);

function screensHTML(){
  return S.scenes.map(function(sc, i){
    var h = '<section class="scr" id="' + esc(sc.id) + '"><div class="in"><div class="top" data-n="' + (i + 2) + '"></div>';
    if (sc.image) h += '<div class="pic' + (sc.small_pic ? ' sm' : '') + '"><img src="' + esc(sc.image) + '" width="' + (sc.w || '') + '" height="' + (sc.h || '') + '" alt="' + esc(t(sc.alt)) + '" loading="lazy"></div>';
    h += '<h2 class="big">' + esc(t(sc.big)) + '</h2>';
    if (sc.small) h += '<p class="small">' + esc(t(sc.small)) + '</p>';
    if (sc.lines) h += '<ul class="qa">' + sc.lines.map(function(l){ return '<li><b>' + esc(t(l.q)) + '</b><span>' + esc(t(l.a)) + '</span></li>'; }).join('') + '</ul>';
    if (sc.source && sc.source.doi) h += '<a class="src" href="https://doi.org/' + esc(sc.source.doi) + '" target="_blank" rel="noopener" aria-label="' + esc(u('source') + ': ' + t(sc.source.label) + ' (' + u('newTab') + ')') + '">' + u('source') + ': ' + esc(t(sc.source.label)) + ' ↗</a>';
    return h + '</div></section>';
  }).join('');
}

/* the static dash row at the top of each screen (as on each carousel slide) */
function tops(){
  var label = u('episode') + ' ' + S.number + ': ' + t(S.title);
  [].forEach.call(doc.querySelectorAll('.top[data-n]'), function(el){
    var n = +el.getAttribute('data-n'), h = '<div class="dash" aria-hidden="true">';
    for (var i = 1; i <= NSCR; i++) h += '<b class="' + (i < n ? 'on' : i === n ? 'now' : '') + '"></b>';
    h += '</div>';
    if (!el.hasAttribute('data-nolabel')) h += '<span class="eplabel">' + esc(label) + '</span>';
    el.innerHTML = h;
  });
}

var YTSVG = '<svg viewBox="0 0 36 26" aria-hidden="true"><rect width="36" height="26" rx="7" fill="#FF0000"/><path d="M14.5 7.5l9 5.5-9 5.5z" fill="#fff"/></svg>';
function ytHTML(){
  var y = S.youtube || {};
  function pill(k, label){
    return y[k] ? '<a class="yt-pill" lang="' + k + '" href="' + esc(y[k]) + '" target="_blank" rel="noopener">' + YTSVG + label + '</a>'
      : '<span class="yt-pill soon" lang="' + k + '" aria-disabled="true">' + YTSVG + label + ' <em lang="' + lang + '">' + u('soon') + '</em></span>';
  }
  return pill('en', 'English') + pill('ar', 'العربية');
}

var screens = [], dots = [];
function setLang(l, fromStorage){
  lang = l; html.lang = l; html.dir = l === 'ar' ? 'rtl' : 'ltr';
  if (!fromStorage){ try{ localStorage.setItem('al-lang', l); }catch(e){} }
  [].forEach.call(doc.querySelectorAll('[data-u]'), function(el){ el.textContent = u(el.getAttribute('data-u')); });
  [].forEach.call(doc.querySelectorAll('#langSwitch button'), function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang === l)); });
  doc.getElementById('share').setAttribute('aria-label', u('share'));
  doc.getElementById('ribbon').textContent = t(S.ribbon);
  doc.getElementById('hook').textContent = t(S.hook);
  doc.getElementById('heroArt').alt = t(S.art.alt);
  doc.getElementById('yt').innerHTML = ytHTML();
  storyEl.innerHTML = screensHTML();
  screens = [].slice.call(storyEl.querySelectorAll('.scr'));
  prog.innerHTML = ''; prog.setAttribute('aria-label', u('progress'));
  dots = screens.map(function(s, i){ var a = doc.createElement('a'); a.href = '#' + s.id; a.innerHTML = '<i></i>';
    a.setAttribute('aria-label', (i + 1) + ' ' + u('of') + ' ' + N + ': ' + t(S.scenes[i].nav)); a.title = t(S.scenes[i].nav); prog.appendChild(a); return a; });
  tops();
  doc.title = t(S.hook) + (l === 'ar' ? ' · مختبرات عداني' : ' · Addani Labs');
  layout(); update();
}

/* ---------- the side helix ----------
   Drawn on a canvas beside the text (left in English, right in Arabic) and anchored to the page, so it turns as you
   scroll. One letter sits on the helix at mid-screen: navy G, tomato-red A at the mutation screen, navy G again at the
   edit screen (STORY.letter). Letters are illustrative, not a real sequence. */
var cv = doc.getElementById('helix'), cx = cv.getContext('2d'), dpr = 1;
var railX = 0, railW = 34, wide = false, storyTop = 0, storyBot = 0, bigM = 0, bigE = 0;
function docTop(el){ return el.getBoundingClientRect().top + W.scrollY; }
function layout(){
  if (!screens.length) return;
  wide = W.innerWidth >= 900;
  railW = wide ? 72 : 34;
  var rtl = html.dir === 'rtl', col = screens[0].querySelector('.in').getBoundingClientRect();
  if (wide){ railX = rtl ? Math.min(W.innerWidth - railW - 16, col.right + 64) : Math.max(16, col.left - 64 - railW); }
  else { railX = rtl ? W.innerWidth - railW - 8 : 8; }
  dpr = Math.min(W.devicePixelRatio || 1, 2);
  cv.style.left = railX + 'px'; cv.style.width = railW + 'px'; cv.style.height = W.innerHeight + 'px';
  cv.width = Math.round(railW * dpr); cv.height = Math.round(W.innerHeight * dpr);
  storyTop = docTop(storyEl); storyBot = storyTop + storyEl.offsetHeight;
  function mid(id){ var el = id && doc.querySelector('#' + id + ' .big'); if (!el) return 1e9; var r = el.getBoundingClientRect(); return r.top + W.scrollY + r.height/2; }
  var L = S.letter || {}; bigM = mid(L.mutation); bigE = mid(L.edit);
}
/* 0 → 1 as a heading moves from 90% to 62% of the screen height */
function pAt(y){ var v = y - W.scrollY, vh = W.innerHeight; var p = Math.max(0, Math.min(1, (vh*0.90 - v) / (vh*0.28))); return reduce ? (p > .5 ? 1 : 0) : p; }
function mix(a, b, k){ return 'rgb(' + [0,1,2].map(function(i){ return Math.round(a[i] + (b[i]-a[i])*k); }).join(',') + ')'; }
var NAVY=[21,41,74], RED=[228,87,46];
function drawHelix(){
  var vh = W.innerHeight, sy = W.scrollY, c = cx;
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,railW,vh);
  var y0 = Math.max(0, storyTop - sy), y1 = Math.min(vh, storyBot - sy);
  if (y1 <= y0) return;
  var mid = railW/2, A = railW*0.36, lam = wide ? 58 : 44, rot = reduce ? 0 : sy/260, step = wide ? 26 : 22;
  c.save(); c.beginPath(); c.rect(0, y0, railW, y1-y0); c.clip();
  var first = Math.ceil((y0 + sy)/step)*step;
  for (var dy = first; dy - sy <= y1; dy += step){
    var y = dy - sy, ph = dy/lam + rot, s = Math.sin(ph);
    c.strokeStyle = 'rgba(21,41,74,' + (0.08 + 0.16*Math.abs(Math.cos(ph))) + ')';
    c.lineWidth = wide ? 2 : 1.6; c.beginPath(); c.moveTo(mid + A*s, y); c.lineTo(mid - A*s, y); c.stroke();
  }
  [1,-1].forEach(function(sign){
    c.beginPath();
    for (var y = y0; y <= y1; y += 3){ var x = mid + sign*A*Math.sin((y + sy)/lam + rot); if (y===y0) c.moveTo(x,y); else c.lineTo(x,y); }
    c.strokeStyle = 'rgba(21,41,74,.62)'; c.lineWidth = wide ? 2.6 : 2.1; c.stroke();
  });
  var ly = vh * 0.5;
  if (ly > y0 + 16 && ly < y1 - 16){
    var pm = pAt(bigM), pe = pAt(bigE), col, letter;
    if (pe > 0){ col = mix(RED, NAVY, pe); letter = pe < .5 ? 'A' : 'G'; }
    else { col = mix(NAVY, RED, pm); letter = pm < .5 ? 'G' : 'A'; }
    var r = wide ? 17 : 13;
    c.fillStyle = 'rgba(241,231,210,.96)'; c.beginPath(); c.arc(mid, ly, r + 3, 0, Math.PI*2); c.fill();
    c.fillStyle = col; c.beginPath(); c.arc(mid, ly, r, 0, Math.PI*2); c.fill();
    c.fillStyle = '#fff'; c.font = '800 ' + (wide ? 19 : 14) + 'px "Archivo", Arial, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(letter, mid, ly + 1);
  }
  c.restore();
}

/* ---------- scroll-linked updates (no pop-ins: every word is already on the page) ---------- */
function update(){
  if (!screens.length) return;
  var midY = W.scrollY + W.innerHeight*0.5, idx = -1;
  screens.forEach(function(s, i){ if (docTop(s) <= midY) idx = i; });
  prog.classList.toggle('off', !(midY >= storyTop && midY < storyBot));
  dots.forEach(function(a, i){
    a.classList.toggle('done', i < idx); a.classList.toggle('now', i === idx);
    if (i === idx) a.setAttribute('aria-current', 'step'); else a.removeAttribute('aria-current');
  });
  drawHelix();
}
var ticking = false;
W.addEventListener('scroll', function(){ if (!ticking){ ticking = true; requestAnimationFrame(function(){ ticking = false; update(); }); } }, { passive:true });
W.addEventListener('resize', function(){ layout(); update(); });
W.addEventListener('load', function(){ layout(); update(); });
if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function(){ layout(); update(); });

doc.getElementById('langSwitch').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b && b.dataset.lang !== lang) setLang(b.dataset.lang); });
W.addEventListener('storage', function(e){ if (e.key === 'al-lang' && (e.newValue === 'en' || e.newValue === 'ar')) setLang(e.newValue, true); });

var toast = doc.getElementById('toast'), tt;
doc.getElementById('share').addEventListener('click', function(){
  var sh = S.share || {}, url = sh.url || location.href, data = { title: t(S.hook), text: t(sh.text), url: url };
  if (navigator.share){ navigator.share(data).catch(function(){}); return; }
  var done = function(){ toast.textContent = u('copied'); toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(function(){ toast.classList.remove('on'); }, 1800); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, done); else done();
});

setLang(lang, true);
/* a link like episode-01-crispr.html#s3 opens on that screen once the screens exist */
if (location.hash){ var target = doc.getElementById(decodeURIComponent(location.hash.slice(1))); if (target) target.scrollIntoView(); }
})();
</script>
</body>
