<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discoveries · Addani Labs</title>
<meta name="description" content="The Discoveries series by Addani Labs: a scientific breakthrough in 5 easy slides.">
<meta name="theme-color" content="#F4EFE4">
<!-- Link preview = the approved Episode 1 YouTube thumbnail (Mo, 10-05-2026) -->
<meta property="og:type" content="article">
<meta property="og:site_name" content="Addani Labs">
<meta property="og:title" content="CRISPR · Discoveries, Episode 1 · Addani Labs">
<meta property="og:description" content="What if doctors could fix the mutation you were born with? The episode in 5 easy slides.">
<meta property="og:url" content="https://www.addanilabs.org/episodes/episode-01-crispr.html">
<meta property="og:image" content="https://www.addanilabs.org/episodes/assets/ep01/thumb-en-share.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta property="og:image:alt" content="We can now edit human DNA: a cartoon scientist looks up as robot scissors cut a glowing DNA helix.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.addanilabs.org/episodes/assets/ep01/thumb-en-share.jpg">
<link rel="icon" href="../assets/logo-blue.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap">
<style>
/* ===================================================================
   Discoveries slide engine (Addani Labs), "easy read" (Mo, 10-05-2026)
   One font per language, one picture + one big line + one short
   sentence per slide. All text, colours and pictures come from
   window.STORY (episode-NN-<slug>-story.js, same folder).
   =================================================================== */
:root{
  --bg:#F4EFE4; --card:#FFFFFF; --ink:#1F1D1A; --ink2:#4A4640; --accent:#E4572E; --ink-rgb:31,29,26;
  --font:"Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --top-h:64px;
}
html[lang="ar"]{ --font:"Cairo", Tahoma, sans-serif; }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); }
body{ font-family:var(--font); -webkit-font-smoothing:antialiased; }
button{ font:inherit; color:inherit; }
a{ color:inherit; }
img{ -webkit-user-drag:none; user-select:none; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; border-radius:6px; }

/* ---------- top bar ---------- */
.topbar{
  position:fixed; top:0; inset-inline:0; height:var(--top-h); z-index:50;
  display:flex; align-items:center; gap:16px; padding-inline:clamp(16px,3vw,36px);
  background:var(--bg); border-bottom:1px solid rgba(var(--ink-rgb),.08);
}
.logo-link{ display:block; flex:none; }
.logo-crop{ display:block; position:relative; overflow:hidden; aspect-ratio:860/275; height:32px; }
.logo-crop img{ position:absolute; width:125.58%; max-width:none; height:auto; left:-11.98%; top:-80.73%; }
/* Arabic pages show the Arabic logo, مختبرات عداني (Mo, 10-05-2026) */
.logo-ar{ display:none; height:32px; width:auto; }
html[lang="ar"] .logo-crop{ display:none; }
html[lang="ar"] .logo-ar{ display:block; }
/* "Episodes" = a clear pill button, easy to tap (Mo, 10-05-2026) */
.back-link{ display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 18px; border-radius:999px;
  font-weight:700; font-size:1rem; text-decoration:none; background:var(--card); border:1.5px solid rgba(var(--ink-rgb),.22); }
.back-link:hover{ border-color:var(--accent); }
.back-link .arr{ color:var(--accent); }
html[dir="rtl"] .back-link .arr{ display:inline-block; transform:scaleX(-1); }
.top-title{ flex:1; text-align:center; font-weight:700; font-size:1rem; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lang{ display:inline-flex; border:1.5px solid rgba(var(--ink-rgb),.7); border-radius:999px; overflow:hidden; flex:none; background:var(--card); }
.lang button{ border:0; background:transparent; cursor:pointer; padding:6px 13px; min-width:42px; font-weight:700; font-size:.9rem; line-height:1.2; color:var(--ink2); }
.lang button[data-lang="en"]{ font-family:"Atkinson Hyperlegible",sans-serif; }
.lang button[data-lang="ar"]{ font-family:"Cairo",sans-serif; font-size:1rem; line-height:1.1; }
.lang button[aria-pressed="true"]{ background:var(--ink); color:#fff; }

/* ---------- slides ---------- */
#story{ height:100vh; height:100dvh; overflow-y:auto; scroll-snap-type:y mandatory; overscroll-behavior-y:contain; outline:none; scrollbar-width:none; }
#story::-webkit-scrollbar{ display:none; }
.slide{
  min-height:100vh; min-height:100dvh; scroll-snap-align:start; scroll-snap-stop:always;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:calc(var(--top-h) + 20px) clamp(22px,6vw,80px) 96px;
}
.inner{ width:100%; max-width:780px; display:flex; flex-direction:column; align-items:center; }
.step{ margin:0 0 14px; font-weight:700; font-size:1rem; color:var(--accent); }
.pic{ height:clamp(150px, 32vh, 340px); width:100%; display:flex; justify-content:center; margin-bottom:clamp(14px,3vh,30px); }
.pic img{ height:100%; width:100%; max-width:460px; object-fit:contain;
  filter:drop-shadow(0 12px 14px rgba(var(--ink-rgb),.18)); }
.big{ margin:0; font-weight:700; font-size:clamp(2rem, 1.2rem + 3vw, 3.6rem); line-height:1.12; letter-spacing:-.01em; text-wrap:balance; }
html[lang="ar"] .big{ font-weight:800; line-height:1.4; letter-spacing:0; font-size:clamp(1.8rem, 1.1rem + 2.7vw, 3.2rem); }
.small{ margin:18px 0 0; font-size:clamp(1.15rem, 1rem + .6vw, 1.5rem); line-height:1.55; color:var(--ink2); max-width:32em; text-wrap:pretty; }
html[lang="ar"] .small{ line-height:1.8; }
.small b{ color:var(--ink); }
.src{ margin-top:22px; font-size:.95rem; color:var(--ink2); text-decoration:underline; text-decoration-color:rgba(var(--ink-rgb),.3); text-underline-offset:4px; }
.src:hover{ color:var(--accent); text-decoration-color:var(--accent); }
.next{
  position:fixed; z-index:40; bottom:calc(22px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:0 22px; border-radius:999px; cursor:pointer;
  border:0; background:var(--ink); color:#fff; font-weight:700; font-size:1rem; transition:opacity .25s;
}
.next svg{ width:18px; height:18px; }
.next.away{ opacity:0; pointer-events:none; }

/* first slide: episode name */
.series{ margin:0 0 10px; font-weight:700; font-size:1.05rem; color:var(--ink2); }

/* last slide: watch on YouTube */
.end-logo{ width:min(340px,64vw); margin-bottom:28px; }
.end-logo .logo-crop{ height:auto; width:100%; }
.end-logo .logo-ar{ width:100%; height:auto; }
.yt-bar{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:28px; }
.yt-pill{ display:inline-flex; align-items:center; gap:10px; min-height:52px; padding:0 22px 0 16px; border-radius:999px;
  background:var(--card); border:1.5px solid rgba(var(--ink-rgb),.2); text-decoration:none; font-weight:700; font-size:1.1rem; }
.yt-pill[lang="en"]{ font-family:"Atkinson Hyperlegible",sans-serif; }
.yt-pill[lang="ar"]{ font-family:"Cairo",sans-serif; }
.yt-pill svg{ width:30px; height:21px; flex:none; }
.yt-pill:hover{ border-color:var(--accent); }
.yt-pill.soon{ opacity:.6; cursor:default; border-style:dashed; }
.yt-pill.soon:hover{ border-color:rgba(var(--ink-rgb),.2); }
.yt-pill em{ font-style:normal; font-weight:400; font-size:.9rem; color:var(--ink2); }
.back-all{ margin-top:26px; font-weight:700; font-size:1rem; color:var(--ink2); text-underline-offset:5px; }

/* gentle fade-in when a slide arrives */
.fade{ opacity:0; transform:translateY(16px); transition:opacity .3s, transform .3s; }
.on .fade{ opacity:1; transform:none; transition:opacity .6s ease calc(var(--d,0) * 120ms), transform .6s ease calc(var(--d,0) * 120ms); }
@media (prefers-reduced-motion: reduce){ .fade, .on .fade{ transform:none; transition:opacity .3s; } }

@media (max-width:700px){
  :root{ --top-h:56px; }
  .topbar{ gap:10px; }
  .top-title{ display:none; }
  .back-link{ margin-inline-end:auto; padding:0 14px; }
  .logo-crop, .logo-ar{ height:26px; }
  .slide{ padding-bottom:100px; }
  .pic{ height:clamp(130px, 28vh, 260px); }
}
@media (max-height:620px){ .pic{ height:22vh; } .big{ font-size:clamp(1.6rem, 1rem + 2.4vw, 2.6rem); } .small{ margin-top:12px; } }
.nodata{ min-height:100vh; display:grid; place-items:center; padding:40px; text-align:center; }
</style>
</head>
<body>
<header class="topbar">
  <a class="logo-link" href="../index.html" id="homeLink"><span class="logo-crop"><img src="../assets/logo-blue.png" alt="Addani Labs" width="1080" height="751"></span><img class="logo-ar" src="../assets/logo-ar-blue.png" alt="مختبرات عداني" width="978" height="210"></a>
  <a class="back-link" href="../index.html#episodes" id="backLink"><span class="arr" aria-hidden="true">&larr;</span><span id="backTxt">Episodes</span></a>
  <div class="top-title" id="topTitle"></div>
  <div class="lang" role="group" id="langSwitch" aria-label="Language">
    <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="ar" lang="ar" aria-pressed="false">ع</button>
  </div>
</header>
<main id="story" tabindex="-1"></main>
<button type="button" class="next" id="next"></button>
<noscript><div class="nodata">This story needs JavaScript. The full episode is on the Addani Labs YouTube channel.</div></noscript>
<!-- Episode data (text, colours, pictures). The engine below never changes per episode. -->
<script src="episode-01-crispr-story.js"></script>
<script>
(function(){
  'use strict';
  var S = window.STORY, doc = document, html = doc.documentElement;
  var story = doc.getElementById('story'), nextBtn = doc.getElementById('next');
  var UI = {
    en: { episodes:'Episodes', episode:'Episode', next:'Next', of:'of', source:'Source', backAll:'Back to all episodes',
          endBig:'Want the full story?', endSmall:'Watch the episode on YouTube.', soon:'Coming soon', newTab:'opens in a new tab',
          noData:'This episode story could not be loaded.' },
    ar: { episodes:'الحلقات', episode:'الحلقة', next:'التالي', of:'من', source:'المصدر', backAll:'العودة إلى كل الحلقات',
          endBig:'تريد القصة كاملة؟', endSmall:'شاهد الحلقة على يوتيوب.', soon:'قريبًا', newTab:'يفتح في نافذة جديدة',
          noData:'تعذّر تحميل قصة هذه الحلقة.' }
  };
  var lang = initialLang(), secs = [], cur = -1;
  if (!S || !S.scenes || !S.scenes.length){ story.innerHTML = '<div class="nodata">' + UI[lang].noData + '</div>'; return; }

  function initialLang(){
    var v = null; try { v = localStorage.getItem('al-lang'); } catch(e){}
    if (v === 'en' || v === 'ar') return v;
    return String(navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
  }
  function t(o){ if (o == null) return ''; if (typeof o !== 'object') return String(o); return o[lang] != null ? o[lang] : (o.en || ''); }
  function u(k){ var ov = (S.ui || {})[lang] || {}; return ov[k] != null ? ov[k] : UI[lang][k]; }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var th = S.theme || {};
  ['bg','card','ink','ink2','accent'].forEach(function(k){ if (th[k]) html.style.setProperty('--' + k, th[k]); });

  var YT = '<svg viewBox="0 0 30 21" aria-hidden="true"><rect width="30" height="21" rx="5" fill="#FF0000"/><path d="M12 6l8 4.5-8 4.5z" fill="#fff"/></svg>';
  var DOWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function slideHTML(sc, i, n){
    var h = '<div class="inner">';
    h += '<p class="step fade">' + (i + 1) + ' ' + u('of') + ' ' + n + '</p>';
    if (i === 0) h += '<p class="series fade">' + esc(t(S.series)) + ' · ' + u('episode') + ' ' + S.number + ': ' + esc(t(S.title)) + '</p>';
    if (sc.image) h += '<div class="pic fade" style="--d:1"><img src="' + esc(sc.image) + '" alt="' + esc(t(sc.imageAlt)) + '"></div>';
    h += '<h2 class="big fade" style="--d:2">' + t(sc.big) + '</h2>';
    if (sc.small) h += '<p class="small fade" style="--d:3">' + t(sc.small) + '</p>';
    if (sc.source && sc.source.doi) h += '<a class="src fade" style="--d:4" href="https://doi.org/' + esc(sc.source.doi) + '" target="_blank" rel="noopener" aria-label="' + esc(u('source') + ': ' + t(sc.source.label) + ' (' + u('newTab') + ')') + '">' + u('source') + ': ' + esc(t(sc.source.label)) + ' ↗</a>';
    return h + '</div>';
  }
  function endHTML(){
    var y = S.youtube || {}, logo = '<span class="logo-crop"><img src="../assets/logo-blue.png" alt="Addani Labs" width="1080" height="751"></span><img class="logo-ar" src="../assets/logo-ar-blue-stacked.png" alt="مختبرات عداني">';
    function pill(k, label){
      return y[k] ? '<a class="yt-pill" lang="' + k + '" href="' + esc(y[k]) + '" target="_blank" rel="noopener">' + YT + label + '</a>'
                  : '<span class="yt-pill soon" lang="' + k + '" aria-disabled="true">' + YT + label + ' <em lang="' + lang + '">· ' + u('soon') + '</em></span>';
    }
    return '<div class="inner"><div class="end-logo fade">' + logo + '</div>' +
      '<h2 class="big fade" style="--d:1">' + (S.ui && S.ui[lang] && S.ui[lang].endBig || u('endBig')) + '</h2>' +
      '<p class="small fade" style="--d:2">' + u('endSmall') + '</p>' +
      '<div class="yt-bar fade" style="--d:3">' + pill('en', 'English') + pill('ar', 'العربية') + '</div>' +
      '<a class="back-all fade" style="--d:4" href="../index.html#episodes">' + u('backAll') + '</a></div>';
  }
  function render(){
    var n = S.scenes.length, out = '';
    S.scenes.forEach(function(sc, i){ out += '<section class="slide" id="' + esc(sc.id) + '" aria-label="' + (i + 1) + ' ' + u('of') + ' ' + n + '">' + slideHTML(sc, i, n) + '</section>'; });
    out += '<section class="slide" id="end">' + endHTML() + '</section>';
    story.innerHTML = out;
    secs = [].slice.call(story.querySelectorAll('.slide'));
    if (cur >= 0) secs[cur].classList.add('on');
  }
  function setLang(l, fromStorage){
    lang = l; html.lang = l; html.dir = l === 'ar' ? 'rtl' : 'ltr';
    if (!fromStorage){ try { localStorage.setItem('al-lang', l); } catch(e){} }
    [].forEach.call(doc.querySelectorAll('#langSwitch button'), function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang === l)); });
    doc.getElementById('backTxt').textContent = u('episodes');
    doc.getElementById('topTitle').textContent = u('episode') + ' ' + S.number + ' · ' + t(S.title);
    doc.title = t(S.title) + ' · ' + t(S.series) + ' · ' + (l === 'ar' ? 'مختبرات عداني' : 'Addani Labs');
    nextBtn.innerHTML = u('next') + DOWN;
    var keep = cur; render(); cur = keep;
    if (cur >= 0) story.scrollTop = secs[cur].offsetTop;
  }
  function update(){
    var mid = story.scrollTop + story.clientHeight / 2, idx = 0;
    secs.forEach(function(s, i){ if (s.offsetTop <= mid) idx = i; });
    if (idx !== cur){ if (cur >= 0 && secs[cur]) secs[cur].classList.remove('on'); cur = idx; secs[cur].classList.add('on'); }
    nextBtn.classList.toggle('away', cur === secs.length - 1);
  }
  story.addEventListener('scroll', function(){ requestAnimationFrame(update); }, { passive:true });
  window.addEventListener('resize', function(){ if (cur >= 0) story.scrollTop = secs[cur].offsetTop; });
  nextBtn.addEventListener('click', function(){ if (cur < secs.length - 1) secs[cur + 1].scrollIntoView({ behavior:'smooth' }); });
  doc.getElementById('langSwitch').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b && b.dataset.lang !== lang) setLang(b.dataset.lang); });
  window.addEventListener('storage', function(e){ if (e.key === 'al-lang' && (e.newValue === 'en' || e.newValue === 'ar')) setLang(e.newValue, true); });

  setLang(lang, true);
  var start = 0;
  if (location.hash){ var h = decodeURIComponent(location.hash.slice(1)); secs.forEach(function(s, i){ if (s.id === h) start = i; }); }
  story.scrollTop = secs[start].offsetTop;
  try { story.focus({ preventScroll:true }); } catch(e){}
  requestAnimationFrame(function(){ requestAnimationFrame(update); });
})();
</script>
</body>
</html>
